# Qualifiers in this list are hard product-attribute requests. They may only
# pass when the Java-owned product snapshot contains one of the declared
# evidence terms; semantic similarity is not accepted as attribute evidence.
verifiedQualifiers:
  - id: android-operating-system
    triggers: [安卓, Android]
    evidenceTerms: [安卓, Android]
  - id: vegan
    triggers: [纯素食, 纯素, 素食]
    evidenceTerms: [纯素食, 纯素, 素食, 植物基]

# Marketplace titles often describe several variants even when the currently
# indexed SKU is more specific. A title-level exclusion may only be overridden
# by an explicit, mutually exclusive SKU property declared here. Absence of the
# excluded word alone is not evidence.
variantExclusionEvidence:
  - id: acoustic-guitar-not-electric-box
    excludedTerms: [电箱]
    requiredAlternativeTerms: [原声款, 原声吉他, 纯原声]
