contract: current
# fillers are joined into one regex alternation, so order is significant:
# alternatives are tried left to right at each position and the first match
# wins. Compound forms must precede the bare verb they contain, otherwise
# "买个空气炸锅" strips "买" and leaks the measure word as "个空气炸锅".
fillers:
  - 我想买一个
  - 我想买个
  - 我要买个
  - 想买一个
  - 买一个
  - 买一台
  - 买一套
  - 来一个
  - 想买个
  - 买个
  - 买台
  - 买套
  - 来个
  - 一款
  - 一个
  - 一台
  - 一套
  - 一双
  - 一部
  - 一只
  - 一瓶
  - 一盒
  - 我想要
  - 我要
  - 想要
  - 想买
  - 帮我
  - 给我
  - 麻烦
  - 请你
  - 请
  - 有没有
  - 能不能
  - 可以吗
  - 可以
  - 推荐一下
  - 推荐
  - 看看
  - 买点
  - 来点
  - 吃点
  - 搜一下
  - 搜索一下
  - 搜索
  - 找找
  - 找
  - 买
  - 要
  - 吃
  # Polite closings, otherwise "电磁炉，谢谢" becomes the keyword "电磁炉谢谢",
  # which matches no product title at all.
  - 谢谢
  - 谢啦
  - 多谢
  - 麻烦了
punctuation: "的了吗呢啊哦呀呗嘛～~，。！？、；：\"'"
