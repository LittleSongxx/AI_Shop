server:
  port: 8099
  shutdown: graceful

spring:
  config:
    import: optional:classpath:aishop-common.yml
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: aishop-product
  cloud:
    openfeign:
      sentinel:
        enabled: true
    loadbalancer:
      cache:
        enabled: true
        ttl: 10s
        capacity: 256
      health-check:
        initial-delay: 0
        interval: 15s
        path:
          default: /actuator/health
      retry:
        enabled: true
        max-retries-on-same-service-instance: 0
        max-retries-on-next-service-instance: 1
        retry-on-all-operations: false
        avoid-previous-instance: true
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        prefer-ip-address: true
        heart-beat-interval: 5
        heart-beat-timeout: 15
        ip-delete-timeout: 30
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
      eager: true
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:3306/aishop_product?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&allowMultiQueries=true&useSSL=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:your-password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBIT_HOST:127.0.0.1}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
    virtual-host: ${RABBIT_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        default-requeue-rejected: false

mybatis:
  mapper-locations: classpath*:com/aishop/mappers/*.xml
  type-aliases-package: com.aishop.entity
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  # 保持现状（关闭），但这是个待决事项而不是终态：本库有 mq_compensation_log，
  # 代码也确实在往里写（见 ProductController 的补偿记录），只是重放任务从未注册过，
  # 所以这些记录一直在堆积、没人重放。打开之前要先看一眼 PENDING 积压：
  # 任务会把 retry_count < 5 的记录重新发出去，其中可能有很久以前的消息，
  # 重放旧消息等于重新触发一次当时的业务动作。确认积压可安全重放后再改成 true。
  common-scheduling:
    enabled: false

aishop:
  internal:
    token: ${AISHOP_INTERNAL_TOKEN:your-token}
    auth-enabled: true
  feign:
    connect-timeout-ms: 3000
    read-timeout-ms: 10000
  security:
    admin-interceptor: true
