server:
  port: ${SERVER_PORT:8105}
  shutdown: graceful

spring:
  config:
    import: optional:classpath:aishop-common.yml
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: aishop-user
  cloud:
    openfeign:
      sentinel:
        enabled: true
    loadbalancer:
      cache:
        enabled: true
        ttl: 10s
        capacity: 256
      health-check:
        initial-delay: 0
        interval: 15s
        path:
          default: /actuator/health
      retry:
        enabled: true
        max-retries-on-same-service-instance: 0
        max-retries-on-next-service-instance: 1
        retry-on-all-operations: false
        avoid-previous-instance: true
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        prefer-ip-address: true
        heart-beat-interval: 5
        heart-beat-timeout: 15
        ip-delete-timeout: 30
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
      eager: true
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/aishop_user?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&allowMultiQueries=true&useSSL=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:your-password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    user: ${FLYWAY_USER:aishop_flyway}
    password: ${FLYWAY_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6380}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
  rabbitmq:
    host: ${RABBIT_HOST:127.0.0.1}
    port: ${RABBIT_PORT:5673}
    username: ${RABBIT_USER:aishop}
    password: ${RABBIT_PASSWORD:aishop}
    virtual-host: ${RABBIT_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        default-requeue-rejected: false

mybatis:
  mapper-locations: classpath*:com/aishop/mappers/*.xml
  type-aliases-package: com.aishop.entity
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

aliyun:
  access-key-id: ${ALIYUN_ACCESS_KEY_ID:}
  access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:}
  directmail:
    account-name: ${ALIYUN_DM_ACCOUNT_NAME:aishop@aishop.com}
    # DirectMail names this boolean switch ReplyToAddress; it is not an email.
    reply-to-address: ${ALIYUN_DM_REPLY_TO_ADDRESS:false}

app:
  # 之前没声明这个键，SignReconcileTask 就一直没注册过：它的开关是 havingValue = "true"
  # 且没有 matchIfMissing，键缺失等于关闭。签到写 Redis 位图失败时没有任何补偿，
  # 这个每小时一次的对账是唯一的兜底，本该是开着的。
  common-scheduling:
    enabled: true
  sign:
    # SignDailyInitTask 单独关掉，不跟着上面一起开：它在零点把整张 user_sign_record
    # 无 LIMIT 地读进内存（selectList 只在 simplePage 非空时才拼 limit），
    # 而写进去的是全 0 位图——getBit 读不存在的键本来就返回 0，这些键存不存在不改变任何行为。
    # 代价是全表扫描，收益是零。要开之前先把那个查询改成分页。
    daily-init-enabled: false

user:
  temp-ban:
    ms: ${USER_TEMP_BAN_MS:7200000}
    reconcile-interval-ms: ${USER_TEMP_BAN_RECONCILE_INTERVAL_MS:60000}
    reconcile-batch-size: ${USER_TEMP_BAN_RECONCILE_BATCH_SIZE:100}

mq:
  outbox:
    dispatch-enabled: true
  compensation:
    # 用户库现在持有公共补偿审查表，允许自动恢复发送失败；消费失败仍保留人工审查，
    # MqCompensationLogService 的自动任务会刻意跳过 mq.consume 记录。
    auto-replay-enabled: true

aishop:
  agent:
    base-url: ${AISHOP_AGENT_BASE_URL:http://127.0.0.1:7050}
    privacy-connect-timeout-ms: 1000
    privacy-read-timeout-ms: 10000
  internal:
    token: ${AISHOP_INTERNAL_TOKEN:your-token}
    auth-enabled: true
  feign:
    connect-timeout-ms: 3000
    read-timeout-ms: 10000
  security:
    admin-interceptor: true
