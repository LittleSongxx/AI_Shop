server:
  port: ${SERVER_PORT:8111}
  shutdown: graceful

spring:
  config:
    import: optional:classpath:aishop-common.yml
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: aishop-admin
  cloud:
    openfeign:
      sentinel:
        enabled: true
    loadbalancer:
      cache:
        enabled: true
        ttl: 10s
        capacity: 256
      health-check:
        initial-delay: 0
        interval: 15s
        path:
          default: /actuator/health
      retry:
        enabled: true
        max-retries-on-same-service-instance: 0
        max-retries-on-next-service-instance: 1
        retry-on-all-operations: false
        avoid-previous-instance: true
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        prefer-ip-address: true
        heart-beat-interval: 5
        heart-beat-timeout: 15
        ip-delete-timeout: 30
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
      eager: true
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/aishop_admin?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&allowMultiQueries=true&useSSL=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:your-password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  # Admin owns cross-schema analytics views. Keep their definer privileges on
  # a migration-only identity instead of widening the Admin runtime account.
  flyway:
    user: ${FLYWAY_USER:${MYSQL_USER:root}}
    password: ${FLYWAY_PASSWORD:${MYSQL_PASSWORD:your-password}}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6380}
  rabbitmq:
    host: ${RABBIT_HOST:127.0.0.1}
    port: ${RABBIT_PORT:5673}
    username: ${RABBIT_USER:aishop}
    password: ${RABBIT_PASSWORD:aishop}
    virtual-host: ${RABBIT_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        default-requeue-rejected: false

aishop:
  agent:
    base-url: ${AGENT_BASE_URL:http://127.0.0.1:7050}
    connect-timeout-ms: ${AGENT_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${AGENT_READ_TIMEOUT_MS:50000}
  internal:
    token: ${AISHOP_INTERNAL_TOKEN:your-token}
    auth-enabled: true
  feign:
    connect-timeout-ms: 3000
    read-timeout-ms: 10000
  security:
    admin-interceptor: true

app:
  common-scheduling:
    enabled: true

mq:
  compensation:
    auto-replay-enabled: true
  outbox:
    dispatch-enabled: true

mybatis:
  mapper-locations: classpath*:com/aishop/mappers/*.xml
  type-aliases-package: com.aishop.entity
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
