server:
  port: 8102
  shutdown: graceful

spring:
  config:
    import: optional:classpath:aishop-common.yml
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: aishop-stock
  cloud:
    openfeign:
      sentinel:
        enabled: true
    loadbalancer:
      cache:
        enabled: true
        ttl: 10s
        capacity: 256
      health-check:
        initial-delay: 0
        interval: 15s
        path:
          default: /actuator/health
      retry:
        enabled: true
        max-retries-on-same-service-instance: 0
        max-retries-on-next-service-instance: 1
        retry-on-all-operations: false
        avoid-previous-instance: true
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        prefer-ip-address: true
        heart-beat-interval: 5
        heart-beat-timeout: 15
        ip-delete-timeout: 30
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
      eager: true
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:3306/aishop_stock?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&allowMultiQueries=true&useSSL=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:your-password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6380}
  rabbitmq:
    host: ${RABBIT_HOST:127.0.0.1}
    port: ${RABBIT_PORT:5673}
    username: ${RABBIT_USER:aishop}
    password: ${RABBIT_PASSWORD:aishop}
    virtual-host: ${RABBIT_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        default-requeue-rejected: false

mybatis:
  mapper-locations: classpath*:com/aishop/mappers/*.xml
  type-aliases-package: com.aishop.entity
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  # 本服务没有自己的定时任务，且库里没有 mq_compensation_log，打开只会让
  # MqCompensationAutoReplayTask 空转报错（它的开关是 matchIfMissing = true）。
  # 注：RefundStockListener 消费失败时会尝试写补偿记录，本库没这张表所以写不进去
  # （recorder 会 catch 并打 error，Redis 副本也一起跳过）。那是建表脚本的缺口，
  # 不是这个开关能解决的，改开关只会把问题换成另一种报错。
  common-scheduling:
    enabled: false

aishop:
  internal:
    token: ${AISHOP_INTERNAL_TOKEN:your-token}
    auth-enabled: true
  feign:
    connect-timeout-ms: 3000
    read-timeout-ms: 10000

seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: aishop_tx_group
  enable-auto-data-source-proxy: true
  data-source-proxy-mode: AT
  service:
    vgroup-mapping:
      aishop_tx_group: default
      default_tx_group: default
    grouplist:
      default: ${SEATA_SERVER_ADDR:127.0.0.1:8092}
  registry:
    type: file
  config:
    type: file
