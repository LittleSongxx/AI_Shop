server:
  port: ${SERVER_PORT:8108}
  shutdown: graceful

spring:
  config:
    import: optional:classpath:aishop-common.yml
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: aishop-search
  cloud:
    openfeign:
      sentinel:
        enabled: true
    loadbalancer:
      cache:
        enabled: true
        ttl: 10s
        capacity: 256
      health-check:
        initial-delay: 0
        interval: 15s
        path:
          default: /actuator/health
      retry:
        enabled: true
        max-retries-on-same-service-instance: 0
        max-retries-on-next-service-instance: 1
        retry-on-all-operations: false
        avoid-previous-instance: true
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        prefer-ip-address: true
        heart-beat-interval: 5
        heart-beat-timeout: 15
        ip-delete-timeout: 30
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
      eager: true
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/aishop_search?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&allowMultiQueries=true&useSSL=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:your-password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    user: ${FLYWAY_USER:aishop_flyway}
    password: ${FLYWAY_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6380}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
  rabbitmq:
    host: ${RABBIT_HOST:127.0.0.1}
    port: ${RABBIT_PORT:5673}
    username: ${RABBIT_USER:aishop}
    password: ${RABBIT_PASSWORD:aishop}
    virtual-host: ${RABBIT_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        default-requeue-rejected: false
  elasticsearch:
    uris: ${ES_URIS:http://127.0.0.1:9200}
    username: ${ES_USERNAME:}
    password: ${ES_PASSWORD:}
  ai:
    model:
      # Search only needs an EmbeddingModel. Local development uses the
      # deterministic in-process model below; start.sh selects OpenAI-compatible
      # embeddings automatically when EMBEDDING_API_KEY is configured.
      chat: ${SPRING_AI_MODEL_CHAT:none}
      embedding: ${SPRING_AI_MODEL_EMBEDDING:local}
      moderation: none
      audio:
        speech: none
        transcription: none
      image: none
    openai:
      # Keep an unconfigured local install explicit. A fake key makes the
      # service appear configured and causes every request to fail remotely.
      api-key: ${LLM_API_KEY:}
      base-url: ${LLM_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${LLM_MODEL:deepseek-chat}
      embedding:
        api-key: ${EMBEDDING_API_KEY:${LLM_API_KEY:}}
        base-url: ${EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
        # Spring AI appends this path to base-url. DashScope's configured base
        # already contains /v1, so the OpenAI default /v1/embeddings would 404.
        embeddings-path: ${EMBEDDING_PATH:/embeddings}
        options:
          model: ${EMBEDDING_MODEL:text-embedding-v4}
          dimensions: ${EMBEDDING_DIMENSIONS:1024}
    vectorstore:
      elasticsearch:
        initialize-schema: ${VECTOR_INITIALIZE_SCHEMA:true}
        dimensions: ${EMBEDDING_DIMENSIONS:1024}
        index-name: ${VECTOR_INDEX:aishop_vectorstore}
        embedding-field-name: ${VECTOR_FIELD:embedding}

mybatis:
  mapper-locations: classpath*:com/aishop/mappers/*.xml
  type-aliases-package: com.aishop.entity
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

app:
  common-scheduling:
    enabled: false

mq:
  outbox:
    dispatch-enabled: true
  compensation:
    auto-replay-enabled: true

aishop:
  search:
    local-embedding:
      dimensions: ${EMBEDDING_DIMENSIONS:1024}
    vector-contract:
      version: ${VECTOR_INDEX_SCHEMA_VERSION:1}
  rag:
    context-enrichment:
      enabled: ${RAG_CONTEXT_ENRICHMENT_ENABLED:false}
  internal:
    token: ${AISHOP_INTERNAL_TOKEN:your-token}
    auth-enabled: true
  # P3-2 Multimodal RAG: VLM image description during document ingestion.
  # Set vlm.enabled=true and provide an api-key to activate.
  # Falls back to DASHSCOPE_API_KEY when VLM_API_KEY is absent.
  vlm:
    enabled: ${VLM_ENABLED:false}
    api-key: ${VLM_API_KEY:${DASHSCOPE_API_KEY:}}
    base-url: ${VLM_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    model: ${VLM_MODEL:qwen-vl-plus}
    max-tokens: ${VLM_MAX_TOKENS:${VLM_IMAGE_MAX_TOKENS:150}}
    connect-timeout-seconds: ${VLM_CONNECT_TIMEOUT_SECONDS:5}
    timeout-seconds: ${VLM_TIMEOUT_SECONDS:${VLM_TIMEOUT:15}}
  feign:
    connect-timeout-ms: 3000
    read-timeout-ms: 10000
  security:
    admin-interceptor: true
