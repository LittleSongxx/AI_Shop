# name 固定成 shop，和 docker-compose.middleware.yml 一致，这样两个文件属于同一个
# Compose project，`docker compose -p shop ps` 能一次看全，卷名也稳定为 shop_*。
# 注意它跟网络无关：本文件不声明任何 network，Prometheus 是走 host.docker.internal
# 抓宿主机上的服务，从来就没有加入过 middleware 的 aishop-net。
#
# 卷前缀同理跟着 name 走，现在是 shop_prometheus-data / shop_grafana-data。
# 加 name 之前起过的话，历史指标留在 deploy_* 那套卷里，没被删，按需手动迁移。
name: shop

# Prometheus + Grafana + OTel Collector + Tempo + Loki + Alloy，只做观测，不含业务组件。
# 中间件（MySQL/Redis/RabbitMQ/ES/Nacos/Seata）见 docker-compose.middleware.yml。
#
#   docker compose -f docker-compose.observability.yml up -d
#   Grafana  http://localhost:${GRAFANA_PORT:-3000}
#   Prometheus http://localhost:${PROMETHEUS_PORT:-9090}
#   Loki http://localhost:${LOKI_PORT:-3100}
#   Alloy http://localhost:${ALLOY_PORT:-12345}
#   OTLP gRPC localhost:${OTEL_GRPC_PORT:-4317} / HTTP localhost:${OTEL_HTTP_PORT:-4318}
#
# 默认抓取目标写的是 host.docker.internal，即服务跑在宿主机、这两个容器跑在 Docker 里。
# 端口只绑 127.0.0.1：两个面板都无鉴权保护指标内容，不要直接暴露到公网。

services:
  tempo:
    # Tempo 3.0 刚发布且包含破坏性升级；本地栈固定在最新 2.x 补丁线。
    image: grafana/tempo:2.10.8
    container_name: aishop-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:${TEMPO_PORT:-3200}:3200"
    mem_limit: ${TEMPO_MEMORY_LIMIT:-512m}

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.158.0
    container_name: aishop-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yml"]
    depends_on:
      - tempo
    volumes:
      - ./otel/collector.yml:/etc/otelcol/config.yml:ro
    ports:
      - "127.0.0.1:${OTEL_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTEL_HTTP_PORT:-4318}:4318"
    mem_limit: ${OTEL_COLLECTOR_MEMORY_LIMIT:-256m}

  loki-init:
    image: busybox:1.37.0
    container_name: aishop-loki-init
    restart: "no"
    user: "0:0"
    command:
      - sh
      - -c
      - >-
        mkdir -p /var/loki/chunks /var/loki/rules /var/loki/compactor
        && chown -R 10001:10001 /var/loki
    volumes:
      - loki-data:/var/loki
    mem_limit: ${LOKI_INIT_MEMORY_LIMIT:-64m}

  loki:
    image: grafana/loki:3.7.5
    container_name: aishop-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    depends_on:
      loki-init:
        condition: service_completed_successfully
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/var/loki
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    mem_limit: ${LOKI_MEMORY_LIMIT:-384m}

  alloy:
    # Promtail 已结束生命周期；Alloy 是 Grafana 官方推荐的日志采集器。
    image: grafana/alloy:v1.18.1
    container_name: aishop-alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      - loki
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ../run/logs:/var/log/aishop:ro
      - alloy-data:/var/lib/alloy/data
    ports:
      - "127.0.0.1:${ALLOY_PORT:-12345}:12345"
    mem_limit: ${ALLOY_MEMORY_LIMIT:-256m}

  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: aishop-prometheus
    restart: unless-stopped
    extra_hosts:
      # Linux 上没有内置的 host.docker.internal，这里显式映射到宿主网关
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # start.sh 根据实际动态端口写入 file-SD 目标；目录不存在时
      # Prometheus 仍可启动，待完整栈启动后会自动发现目标。
      - ../run/observability:/etc/prometheus/runtime:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    mem_limit: ${PROMETHEUS_MEMORY_LIMIT:-512m}

  grafana:
    image: grafana/grafana:13.1.3
    container_name: aishop-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - tempo
      - loki
    environment:
      # 密码从环境变量注入，不要把明文写进仓库
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?请先设置 GRAFANA_ADMIN_PASSWORD}
      # 关掉匿名访问和注册，面板里能看到 URI、SQL 等内部信息
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Grafana 13 默认会在后台下载多个 Explore/Drilldown 插件并检查更新。
      # 本项目只使用镜像内置的数据源，关闭隐式联网以保证离线可重复启动。
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    mem_limit: ${GRAFANA_MEMORY_LIMIT:-512m}

volumes:
  prometheus-data:
  grafana-data:
  tempo-data:
  loki-data:
  alloy-data:
