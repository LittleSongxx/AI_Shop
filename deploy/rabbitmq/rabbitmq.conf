# Keep RabbitMQ flow control below the container's 768 MiB default cgroup
# limit. A relative watermark is computed from host memory on this Docker/WSL
# runtime and can otherwise exceed the container limit by tens of GiB.
vm_memory_high_watermark.absolute = 460MiB

# The generic broker default is intentionally small. Keep enough free space
# for quorum queue segment writes and local recovery drills.
disk_free_limit.absolute = 1GiB
