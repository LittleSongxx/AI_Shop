
# name 固定成 shop（observability 那份也一样），否则 Compose 按目录名生成 project，
# 两份文件会分属 deploy / 各自的 project，`docker compose ps` 看不全。
#
# ⚠️ 卷的完整名是 <project>_<卷名>，所以 name 决定卷前缀：现在是 shop_aishop_mysql。
# 如果你在加 name 之前起过这套栈，那批卷叫 deploy_aishop_*（按目录名生成），
# 加上 name 之后等于换了一套空卷：MySQL 变空库、Nacos 配置没了、ES 索引没了，
# 正好踩回"库里没数据 → 搜推空转"那条链。老数据不会被删，`docker volume ls | grep aishop`
# 能看到；要接着用就先 down，再把 deploy_* 的内容拷进 shop_*（或临时把 name 改回原样）。
# 本机当前只有 shop_* 一套（已确认无 deploy_* 残留），所以没有这个问题。
name: shop

networks:
  aishop-net:
    name: aishop-net
    driver: bridge

services:
  mysql:
    image: mysql:8.3
    container_name: aishop-mysql
    networks: [aishop-net]
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-authentication-plugin=caching_sha2_password
      - --innodb_buffer_pool_size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-128M}
      - --max_connections=${MYSQL_MAX_CONNECTIONS:-150}
    volumes:
      - aishop_mysql:/var/lib/mysql
    mem_limit: ${MYSQL_MEMORY_LIMIT:-640m}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: aishop-redis
    networks: [aishop-net]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - aishop_redis:/data
    mem_limit: ${REDIS_MEMORY_LIMIT:-384m}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: aishop-rabbitmq
    networks: [aishop-net]
    ports:
      - "${RABBIT_PORT:-5673}:5672"
      - "${RABBIT_MANAGEMENT_PORT:-15673}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: aishop
      RABBITMQ_DEFAULT_PASS: aishop
      RABBITMQ_DEFAULT_VHOST: /
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-memory ${RABBITMQ_MEMORY_WATERMARK:-512M}"
    volumes:
      - aishop_rabbit:/var/lib/rabbitmq
    mem_limit: ${RABBITMQ_MEMORY_LIMIT:-768m}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: aishop-nacos
    networks: [aishop-net]
    ports:
      - "${NACOS_PORT:-8848}:8848"
      - "${NACOS_GRPC_PORT:-9848}:9848"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      JVM_XMS: ${NACOS_JVM_XMS:-192m}
      JVM_XMX: ${NACOS_JVM_XMX:-384m}
      JVM_XMN: ${NACOS_JVM_XMN:-96m}
      NACOS_AUTH_ENABLE: "false"
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: root
      MYSQL_SERVICE_DB_PARAM: characterEncoding=utf8&connectTimeout=10000&socketTimeout=30000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    mem_limit: ${NACOS_MEMORY_LIMIT:-768m}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8848/nacos/"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s
    restart: unless-stopped

  elasticsearch:
    build:
      context: ./elasticsearch
      dockerfile: Dockerfile
    image: aishop-elasticsearch:9.2.1-ik
    container_name: aishop-es
    networks: [aishop-net]
    ports:
      - "${ES_PORT:-9200}:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms256m -Xmx512m}
      cluster.name: aishop-es
      bootstrap.memory_lock: "false"
    volumes:
      - aishop_es:/usr/share/elasticsearch/data
    mem_limit: ${ES_MEMORY_LIMIT:-1024m}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200 >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  sentinel:
    image: bladex/sentinel-dashboard:1.8.8
    container_name: aishop-sentinel
    networks: [aishop-net]
    ports:
      - "${SENTINEL_PORT:-8858}:8858"
    environment:
      JAVA_OPT_EXT: "-Xms${SENTINEL_JVM_XMS:-128m} -Xmx${SENTINEL_JVM_XMX:-256m} -Dserver.port=8858 -Dcsp.sentinel.dashboard.server=localhost:8858"
    mem_limit: ${SENTINEL_MEMORY_LIMIT:-384m}
    restart: unless-stopped

  seata-server:
    build:
      context: ./seata
      dockerfile: Dockerfile
    image: aishop-seata-server:2.2.0
    container_name: aishop-seata
    networks: [aishop-net]
    ports:
      - "${SEATA_PORT:-8092}:${SEATA_PORT:-8092}"
      - "${SEATA_CONSOLE_PORT:-7092}:7091"
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
    environment:
      # start.sh sets this to the WSL host's reachable non-loopback address.
      SEATA_IP: ${SEATA_IP:-host.docker.internal}
      SEATA_PORT: ${SEATA_PORT:-8092}
      STORE_MODE: db
      TZ: Asia/Shanghai
      JVM_XMX: ${SEATA_JVM_XMX:-384m}
      JVM_XMS: ${SEATA_JVM_XMS:-192m}
      JVM_MaxDirectMemorySize: ${SEATA_JVM_DIRECT_MEMORY:-128m}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: ${SEATA_MEMORY_LIMIT:-640m}
    restart: unless-stopped

volumes:
  aishop_mysql:
  aishop_redis:
  aishop_rabbit:
  aishop_es:
