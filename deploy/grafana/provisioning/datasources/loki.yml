apiVersion: 1
datasources:
  - name: Loki
    uid: aishop-loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: TraceID
          matcherRegex: '"trace_id"\s*:\s*"([0-9a-f]{32})"'
          datasourceUid: aishop-tempo
          url: '$${__value.raw}'
