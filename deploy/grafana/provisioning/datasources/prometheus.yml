apiVersion: 1
datasources:
  - name: Prometheus
    # uid 要和面板 JSON 里的 datasource.uid 一致，否则导入后每个 panel 都要手动选数据源
    uid: aishop-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      # 与 prometheus.yml 的 scrape_interval 保持一致，避免 Grafana 按更细粒度求值出现空点
      timeInterval: 15s
