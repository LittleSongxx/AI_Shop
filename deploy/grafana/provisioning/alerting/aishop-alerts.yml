# AI_Shop 告警规则（Grafana unified alerting，provisioning 格式）
#
# 面板告诉你"现在什么样"，告警回答"要不要现在看"。这份文件只放后者：每条规则都对应一种
# 用户已经受影响、或者马上就要受影响的状态，而不是把 aishop-overview.json 的每个 panel
# 都翻译成一条告警——那样只会训练出忽略告警的习惯。
#
# 生效方式：Grafana 启动时读 /etc/grafana/provisioning/alerting/*.yml。
#   docker compose 里挂载 deploy/grafana/provisioning -> /etc/grafana/provisioning
# provisioning 出来的规则在 UI 里是只读的，改这个文件重启才生效。
#
# datasource uid 必须和 datasources/prometheus.yml 里的 aishop-prometheus 一致，
# 否则规则导入后会显示 "datasource not found" 而且不会求值。
#
# 阈值的来龙去脉：
#   * 熔断、抓取失败这类是布尔状态，没有调参空间。
#   * 延迟类阈值来自 runtime_sensors.py 的 Histogram buckets——buckets 之外的阈值
#     只会得到插值出来的假精度，所以都取在 bucket 边界上（LLM: 0.5/1/2/3/5/10/30，
#     RAG: 0.01/0.05/0.1/0.3/0.5/1/2/5/10）。
#   * 比率类阈值（RAG 空召回率、任务失败率）目前是有待压测校准的初值，不是实测结论。
#     线上跑够一周后按实际分布回填，别把这些数字当成已验证的 SLO。
#
# for 时长的取法：scrape_interval 是 15s，所以 for 至少给 2m 才能避开单次抓取抖动
# 造成的假告警；对"已经在丢请求"的状态（熔断打开）给 1m，对趋势类给 5m 以上。

apiVersion: 1

groups:
  # ======================================================================== #
  # 一、可用性：服务还在不在                                                   #
  # ======================================================================== #
  - orgId: 1
    name: aishop-availability
    folder: AI_Shop
    interval: 1m
    rules:
      - uid: aishop-target-down
        title: 服务实例抓取失败
        condition: THRESHOLD
        for: 2m
        annotations:
          summary: "{{ $labels.job }} / {{ $labels.instance }} 已连续 2 分钟抓不到指标"
          description: >-
            Prometheus 抓不到该实例。可能是进程挂了、端口变了，也可能只是
            actuator/metrics 端点没暴露——先确认前者。
            Java 侧看 management.endpoints.web.exposure.include，
            Agent 侧确认 /metrics 是否 mount。
        labels:
          severity: critical
          tier: platform
        data:
          - refId: QUERY
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: aishop-prometheus
            model:
              refId: QUERY
              editorMode: code
              expr: up{job=~"aishop-.*"}
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: QUERY
              conditions:
                - evaluator: { type: lt, params: [1] }

  # ======================================================================== #
  # 二、依赖降级：熔断器                                                       #
  #                                                                          #
  # agent_circuit_state 0=closed 1=open 2=half_open。熔断打开意味着 ES / rerank #
  # / embedding 已经在被跳过，回答还在出但质量已经降级——这是最需要主动知道的一类， #
  # 因为用户不会报错，只会觉得"答得不准"。                                       #
  # ======================================================================== #
  - orgId: 1
    name: aishop-dependencies
    folder: AI_Shop
    interval: 1m
    rules:
      - uid: aishop-circuit-open
        title: 熔断器打开（检索链路已降级）
        condition: THRESHOLD
        for: 1m
        annotations:
          summary: "熔断器 {{ $labels.breaker }} 打开，对应依赖正在被跳过"
          description: >-
            es 打开 = 检索无结果，回答退化成纯 LLM 生成，幻觉风险显著上升；
            rerank / embedding 打开 = 仍有召回但排序质量下降。
            先看被熔断依赖自身的健康状况，不要直接调熔断阈值。
        labels:
          severity: critical
          tier: ai
        data:
          - refId: QUERY
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: aishop-prometheus
            model:
              refId: QUERY
              editorMode: code
              expr: max by (breaker) (agent_circuit_state{job=~"aishop-agent(-worker)?"})
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: QUERY
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: aishop-rag-empty-rate
        title: RAG 未命中率偏高
        condition: THRESHOLD
        for: 10m
        annotations:
          summary: "RAG 未命中率 {{ humanizePercentage $values.QUERY.Value }}，超过 30%"
          description: >-
            检索有返回但命不中，说明知识库覆盖不足、切分不合理，或者阈值被调得过严
            （见 settings.py 的 rag_vector_min_cosine / rag_evidence_min_relevance）。
            阈值 0.3 是待校准初值，不是实测 SLO。
        labels:
          severity: warning
          tier: ai
        data:
          - refId: QUERY
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: aishop-prometheus
            model:
              refId: QUERY
              editorMode: code
              # label 值必须和 retriever.py:476 实际 emit 的一致：只有 hit / miss 两种。
              # 写成 result="empty" 之类不存在的值不会报错，只会永远不触发——
              # 比没有这条告警更糟，因为它看起来是有覆盖的。
              # clamp_min 防零除：没有流量时整个表达式为 0，不会产生 NaN 触发告警。
              expr: >-
                sum(rate(agent_rag_search_total{job=~"aishop-agent(-worker)?",result="miss"}[10m]))
                / clamp_min(
                    sum(rate(agent_rag_search_total{job=~"aishop-agent(-worker)?"}[10m])),
                    0.001)
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: QUERY
              conditions:
                - evaluator: { type: gt, params: [0.3] }

      - uid: aishop-order-reference-dependency-errors
        title: 订单自然语言解析依赖连续失败
        condition: THRESHOLD
        for: 5m
        annotations:
          summary: "最近 10 分钟订单解析依赖失败超过 2 次"
          description: >-
            outcome=dependency_error 表示 Agent 无法从 Java 订单服务取得本人订单事实。
            此时用户看到的是明确降级文案，不会被误导为“没有订单”。先检查 Gateway、
            Order 服务和内部令牌；阈值是工程初值，不代表生产 SLO。
        labels:
          severity: warning
          tier: ai
        data:
          - refId: QUERY
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: aishop-prometheus
            model:
              refId: QUERY
              editorMode: code
              expr: >-
                sum(increase(agent_order_reference_total{
                  job=~"aishop-agent(-worker)?",outcome="dependency_error"}[10m]))
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: QUERY
              conditions:
                - evaluator: { type: gt, params: [2] }

  # ======================================================================== #
  # 三、延迟：用户感知得到的慢                                                  #
  # ======================================================================== #
  - orgId: 1
    name: aishop-latency
    folder: AI_Shop
    interval: 1m
    rules:
      - uid: aishop-llm-p95-slow
        title: LLM p95 延迟超过 10s
        condition: THRESHOLD
        for: 5m
        annotations:
          summary: "LLM p95 {{ $values.QUERY.Value }}s，超过 10s"
          description: >-
            10s 取在 histogram bucket 边界上（上一档 5s，下一档 30s）。
            首 token 有流式兜着，但工具调用那一跳是阻塞的，这里慢就是整轮慢。
            先分清是模型侧慢还是自己在串行等：看 agent_tool_call_total 的调用次数变化。
        labels:
          severity: warning
          tier: ai
        data:
          - refId: QUERY
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: aishop-prometheus
            model:
              refId: QUERY
              editorMode: code
              expr: >-
                histogram_quantile(0.95,
                  sum by (le) (
                    rate(agent_llm_latency_seconds_bucket{job=~"aishop-agent(-worker)?"}[10m])))
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: QUERY
              conditions:
                - evaluator: { type: gt, params: [10] }

      - uid: aishop-rag-p95-slow
        title: RAG 检索 p95 延迟超过 2s
        condition: THRESHOLD
        for: 5m
        annotations:
          summary: "RAG 检索 p95 {{ $values.QUERY.Value }}s，超过 2s"
          description: >-
            检索发生在 LLM 之前，这一段的延迟会原封不动加到用户等待时间上。
            混合检索是 BM25 + kNN + rerank 三段，先看是哪一段：
            rerank 走的是外部 DashScope，通常是它。
        labels:
          severity: warning
          tier: ai
        data:
          - refId: QUERY
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: aishop-prometheus
            model:
              refId: QUERY
              editorMode: code
              expr: >-
                histogram_quantile(0.95,
                  sum by (le) (
                    rate(agent_rag_latency_seconds_bucket{job=~"aishop-agent(-worker)?"}[10m])))
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: QUERY
              conditions:
                - evaluator: { type: gt, params: [2] }

      - uid: aishop-agent-total-p95-slow
        title: Agent 端到端 p95 延迟超过 30s
        condition: THRESHOLD
        for: 5m
        annotations:
          summary: "Agent 端到端 p95 {{ $values.QUERY.Value }}s，超过 30s"
          description: >-
            total 从消息入队起算，覆盖排队、意图、检索、工具和生成；旧任务载荷没有入队时间时
            才退化为 Worker 实际处理时长。先按 stage 面板定位慢点，再检查 Worker 积压、
            Java 工具依赖和模型延迟。30 秒只是当前工程告警边界，不代表已验证的线上 SLO。
        labels:
          severity: warning
          tier: ai
        data:
          - refId: QUERY
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: aishop-prometheus
            model:
              refId: QUERY
              editorMode: code
              expr: >-
                histogram_quantile(0.95,
                  sum by (le) (
                    rate(agent_stage_latency_seconds_bucket{job=~"aishop-agent(-worker)?",stage="total"}[10m])))
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: QUERY
              conditions:
                - evaluator: { type: gt, params: [30] }

      - uid: aishop-http-5xx
        title: 网关 5xx 比例超过 1%
        condition: THRESHOLD
        for: 5m
        annotations:
          summary: "{{ $labels.application }} 5xx 占比 {{ humanizePercentage $values.QUERY.Value }}"
          description: >-
            按 application 分组，直接指向出错的服务。5xx 是服务端自己的问题，
            和 4xx 不同，不会因为客户端行为变化而升高。
        labels:
          severity: critical
          tier: business
        data:
          - refId: QUERY
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: aishop-prometheus
            model:
              refId: QUERY
              editorMode: code
              expr: >-
                sum by (application) (
                  rate(http_server_requests_seconds_count{job=~"aishop-gateway|aishop-services",status=~"5.."}[10m]))
                / clamp_min(
                    sum by (application) (
                      rate(http_server_requests_seconds_count{job=~"aishop-gateway|aishop-services"}[10m])),
                    0.001)
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: QUERY
              conditions:
                - evaluator: { type: gt, params: [0.01] }

  # ======================================================================== #
  # 四、异步任务：积压和失败                                                    #
  #                                                                          #
  # 工单类任务积压的表现是"用户提交了但没人处理"，前台看不出异常，只有这里看得出。    #
  # ======================================================================== #
  - orgId: 1
    name: aishop-async-tasks
    folder: AI_Shop
    interval: 1m
    rules:
      - uid: aishop-task-backlog
        title: Agent 任务积压
        condition: THRESHOLD
        for: 10m
        annotations:
          summary: "任务积压 {{ $values.QUERY.Value }} 条，持续 10 分钟未消化"
          description: >-
            积压量持续不降说明消费速率跟不上生产速率，或者 worker 卡在某个任务上。
            对照 agent_task_inflight：inflight 不为 0 但 backlog 不降 = 卡住；
            inflight 为 0 = worker 没在跑。
            阈值 100 是待校准初值——真实容量要压测之后才知道。
        labels:
          severity: warning
          tier: ai
        data:
          - refId: QUERY
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: aishop-prometheus
            model:
              refId: QUERY
              editorMode: code
              expr: max(agent_task_backlog{job="aishop-agent"})
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: QUERY
              conditions:
                - evaluator: { type: gt, params: [100] }

      - uid: aishop-task-dead-rate
        title: Agent 任务进死信率偏高
        condition: THRESHOLD
        for: 10m
        annotations:
          summary: "{{ $labels.queue }} 队列死信率 {{ humanizePercentage $values.QUERY.Value }}"
          description: >-
            result="dead" 是重试用尽或超过 deadline 后的终态（worker.py:246），
            意味着这个任务不会再自己被处理了——工单类任务落到这里就是用户提交了没人管。
            处理完根因还要确认存量死信被重放。
            分母只取 completed + dead 两个终态：agent_task_total 在一个任务的生命周期里
            会 emit published/started/retry/completed 多次，拿全部结果做分母等于把同一个
            任务算好几遍，比率会被稀释到看不出问题。
        labels:
          severity: warning
          tier: ai
        data:
          - refId: QUERY
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: aishop-prometheus
            model:
              refId: QUERY
              editorMode: code
              expr: >-
                sum by (queue) (
                  rate(agent_task_total{job="aishop-agent-worker",result="dead"}[10m]))
                / clamp_min(
                    sum by (queue) (
                      rate(agent_task_total{job="aishop-agent-worker",result=~"completed|dead"}[10m])),
                    0.001)
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: QUERY
              conditions:
                - evaluator: { type: gt, params: [0.1] }

      - uid: aishop-tool-error-rate
        title: 工具调用失败率偏高
        condition: THRESHOLD
        for: 10m
        annotations:
          summary: "工具 {{ $labels.tool }} 失败率 {{ humanizePercentage $values.QUERY.Value }}"
          description: >-
            工具调用打的是 Java 侧内部接口。这里升高通常不是 Agent 的问题，
            而是下游服务或内部鉴权（InternalApiAuthFilter）出了状况。
            按 tool 分组可以直接定位到哪个下游。
            只统计 error / bad_args。mcp_tool_router.py 还会 emit denied 和
            user_id_mismatch，但那两个是越权拦截生效的证据，属于正确行为——
            写成 status!="success" 会把安全机制起作用当成故障告警。
        labels:
          severity: warning
          tier: ai
        data:
          - refId: QUERY
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: aishop-prometheus
            model:
              refId: QUERY
              editorMode: code
              expr: >-
                sum by (tool) (
                  rate(agent_tool_call_total{job=~"aishop-agent(-worker)?",status=~"error|bad_args"}[10m]))
                / clamp_min(
                    sum by (tool) (
                      rate(agent_tool_call_total{job=~"aishop-agent(-worker)?"}[10m])),
                    0.001)
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: QUERY
              conditions:
                - evaluator: { type: gt, params: [0.1] }

  # ======================================================================== #
  # 五、成本口径：有调用但没有可核算价格                                          #
  # ======================================================================== #
  - orgId: 1
    name: aishop-cost-accounting
    folder: AI_Shop
    interval: 1m
    rules:
      - uid: aishop-llm-unpriced-tokens
        title: LLM 存在未定价 token
        condition: THRESHOLD
        for: 10m
        annotations:
          summary: "最近 10 分钟仍有未定价 token，人民币成本口径不完整"
          description: >-
            当前模型或 fallback 模型没有出现在 LLM_PRICING_CNY_PER_MILLION_JSON 中，
            token 用量仍被记录，但人民币成本不会被猜测填充。确认实际 provider 账单价格和模型名后
            再补配置，并核对 input/output 两项；这不是服务故障，但会使成本报表低估。
        labels:
          severity: warning
          tier: ai
        data:
          - refId: QUERY
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: aishop-prometheus
            model:
              refId: QUERY
              editorMode: code
              expr: >-
                sum(increase(agent_llm_unpriced_tokens_total{job=~"aishop-agent(-worker)?",kind="total"}[10m]))
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: QUERY
              conditions:
                - evaluator: { type: gt, params: [0] }
