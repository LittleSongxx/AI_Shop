name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  java:
    name: Java
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Simlect-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress verify

  agent:
    name: Agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Simlect-backend/Simlect-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Simlect-backend/Simlect-agent/requirements.lock
      - run: python -m pip install --requirement requirements.lock
      - run: python -m pip install --no-deps --editable .
      - run: ruff check .
      - run: pytest -q

  frontend:
    name: Frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [Simlect-admin, Simlect-web]
    defaults:
      run:
        working-directory: Simlect-front/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Simlect-front/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run build
