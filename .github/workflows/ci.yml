name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read
  pull-requests: read

jobs:
  java:
    name: Java
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AI_Shop-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress verify

  java-integration:
    name: Java domain integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AI_Shop-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: >-
          mvn --batch-mode --no-transfer-progress -Pintegration
          -pl AI_Shop-common,AI_Shop-order/app -am verify

  agent:
    name: Agent
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: AI_Shop-backend/AI_Shop-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: AI_Shop-backend/AI_Shop-agent/requirements.lock
      - run: python -m pip install --requirement requirements.lock
      - run: python -m pip install --no-deps --editable .
      - run: python -m pip check
      - run: ruff check .
      - run: pytest -q
      - run: pytest -q tests/integration/test_migrations.py
        env:
          RUN_AGENT_MIGRATION_TESTS: "1"
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3306"
          MYSQL_USER: root
          MYSQL_PASSWORD: root
      - name: Validate AI evaluation suite and locked visible datasets
        run: python -m evaluation.cli validate

  repository-contracts:
    name: Repository configuration contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install
          "pytest>=9,<10"
          "PyYAML>=6,<7"
          "httpx>=0.27,<1"
          "redis>=5.2,<7"
          "python-dotenv>=1,<2"
      - run: PYTHONPATH=. python -m pytest -q scripts/test_*.py
      - run: python scripts/check_dependency_exceptions.py

  frontend:
    name: Frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [AI_Shop-admin, AI_Shop-web]
    defaults:
      run:
        working-directory: AI_Shop-front/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: AI_Shop-front/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  web-e2e:
    name: Web Playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AI_Shop-front/AI_Shop-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: AI_Shop-front/AI_Shop-web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          config-file: .github/dependency-review-config.yml

  sbom:
    name: CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            AI_Shop-front/AI_Shop-admin/package-lock.json
            AI_Shop-front/AI_Shop-web/package-lock.json
      - run: python -m pip install cyclonedx-bom==7.3.1
      - run: python scripts/check_dependency_exceptions.py
      - run: bash scripts/generate_sbom.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom-${{ github.run_id }}
          path: artifacts/sbom
          if-no-files-found: error

  evidence-docs:
    name: Evidence and documentation consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "pytest>=9,<10"
      - run: python scripts/check_evidence_manifest.py --require-current
      - run: PYTHONPATH=scripts python -m pytest -q scripts/test_check_evidence_manifest.py
