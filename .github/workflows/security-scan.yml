name: Weekly dependency scan

on:
  schedule:
    - cron: "15 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exceptions:
    name: Exception expiry gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_dependency_exceptions.py

  python-audit:
    name: Python audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AI_Shop-backend/AI_Shop-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: AI_Shop-backend/AI_Shop-agent/requirements.lock
      - run: python -m pip install pip-audit==2.10.1
      - run: pip-audit --requirement requirements.lock

  npm-audit:
    name: npm audit (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [AI_Shop-admin, AI_Shop-web]
    defaults:
      run:
        working-directory: AI_Shop-front/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: AI_Shop-front/${{ matrix.app }}/package-lock.json
      - run: npm audit --omit=dev --audit-level=high

  maven-audit:
    name: Maven OWASP audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AI_Shop-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: python ../scripts/generate_dependency_check_suppressions.py
      - run: >-
          mvn --batch-mode --no-transfer-progress
          org.owasp:dependency-check-maven:12.1.8:aggregate
          -DskipTests
          -DfailBuildOnCVSS=7
          -DossindexAnalyzerEnabled=false
          -DassemblyAnalyzerEnabled=false
          -DretireJsAnalyzerEnabled=false
          -Dformats=HTML,JSON
          -DsuppressionFile=../security/dependency-check-suppression.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report-${{ github.run_id }}
          path: AI_Shop-backend/target/dependency-check-report.*
          if-no-files-found: warn
