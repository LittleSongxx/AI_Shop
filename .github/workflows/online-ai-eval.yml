name: Live AI development and regression evaluation

on:
  schedule:
    - cron: "45 18 * * *"
  workflow_dispatch:
    inputs:
      split:
        description: Visible split to execute; final is deliberately excluded from ephemeral CI
        required: true
        type: choice
        options:
          - regression
          - development
        default: regression

permissions:
  contents: read

concurrency:
  group: live-ai-evaluation
  cancel-in-progress: false

jobs:
  live-evaluation:
    name: Real-provider full-stack evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: ai-evaluation
    defaults:
      run:
        shell: bash
        working-directory: AI_Shop-backend/AI_Shop-agent
    env:
      APP_ENV: development
      APP_PORT: "7050"
      AI_EVAL_AGENT_URL: http://127.0.0.1:7050
      JAVA_WEB_URL: ${{ vars.AI_EVAL_JAVA_WEB_URL }}
      AISHOP_INTERNAL_TOKEN: ${{ secrets.AI_EVAL_INTERNAL_TOKEN }}
      MYSQL_HOST: ${{ vars.AI_EVAL_MYSQL_HOST }}
      MYSQL_PORT: ${{ vars.AI_EVAL_MYSQL_PORT }}
      MYSQL_USER: ${{ secrets.AI_EVAL_MYSQL_USER }}
      MYSQL_PASSWORD: ${{ secrets.AI_EVAL_MYSQL_PASSWORD }}
      MYSQL_DATABASE: ${{ vars.AI_EVAL_MYSQL_DATABASE }}
      REDIS_HOST: ${{ vars.AI_EVAL_REDIS_HOST }}
      REDIS_PORT: ${{ vars.AI_EVAL_REDIS_PORT }}
      REDIS_USERNAME: ${{ secrets.AI_EVAL_REDIS_USERNAME }}
      REDIS_PASSWORD: ${{ secrets.AI_EVAL_REDIS_PASSWORD }}
      REDIS_SSL_ENABLED: ${{ vars.AI_EVAL_REDIS_SSL_ENABLED || 'false' }}
      RABBITMQ_URL: ${{ secrets.AI_EVAL_RABBITMQ_URL }}
      ES_HOSTS: ${{ vars.AI_EVAL_ES_HOSTS }}
      ES_INDEX: ${{ vars.AI_EVAL_ES_INDEX }}
      ES_USERNAME: ${{ secrets.AI_EVAL_ES_USERNAME }}
      ES_PASSWORD: ${{ secrets.AI_EVAL_ES_PASSWORD }}
      ES_VERIFY_SSL: ${{ vars.AI_EVAL_ES_VERIFY_SSL || 'true' }}
      VECTOR_FIELD: embedding
      ES_VECTOR_DIMENSIONS: "1024"
      LLM_API_KEY: ${{ secrets.AI_EVAL_LLM_API_KEY }}
      LLM_BASE_URL: ${{ vars.AI_EVAL_LLM_BASE_URL }}
      LLM_MODEL: ${{ vars.AI_EVAL_LLM_MODEL }}
      EMBEDDING_API_KEY: ${{ secrets.AI_EVAL_EMBEDDING_API_KEY }}
      EMBEDDING_BASE_URL: ${{ vars.AI_EVAL_EMBEDDING_BASE_URL }}
      EMBEDDING_MODEL: ${{ vars.AI_EVAL_EMBEDDING_MODEL }}
      EMBEDDING_DIMENSIONS: "1024"
      RERANK_API_KEY: ${{ secrets.AI_EVAL_RERANK_API_KEY }}
      RERANK_BASE_URL: ${{ vars.AI_EVAL_RERANK_BASE_URL }}
      RERANK_MODEL: ${{ vars.AI_EVAL_RERANK_MODEL }}
      RERANK_REQUIRED: "true"
      OTEL_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: AI_Shop-backend/AI_Shop-agent/requirements.lock
      - run: python -m pip install --requirement requirements.lock
      - run: python -m pip install --no-deps --editable .
      - name: Fail closed when live configuration is incomplete
        run: |
          required=(
            JAVA_WEB_URL AISHOP_INTERNAL_TOKEN MYSQL_HOST MYSQL_PORT MYSQL_USER
            MYSQL_PASSWORD MYSQL_DATABASE REDIS_HOST REDIS_PORT REDIS_PASSWORD
            RABBITMQ_URL ES_HOSTS ES_INDEX LLM_API_KEY LLM_BASE_URL LLM_MODEL
            EMBEDDING_API_KEY EMBEDDING_BASE_URL EMBEDDING_MODEL RERANK_API_KEY
            RERANK_BASE_URL RERANK_MODEL
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("${name}")
            fi
          done
          if (( ${#missing[@]} )); then
            echo "::error::Missing required live evaluation configuration: ${missing[*]}"
            exit 1
          fi
      - name: Validate immutable contracts before live calls
        run: python -m evaluation.cli validate
      - name: Migrate evaluation database
        run: alembic upgrade head
      - name: Start API and worker
        run: |
          mkdir -p .eval-logs
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 7050 > .eval-logs/api.log 2>&1 &
          nohup python -m app.worker > .eval-logs/worker.log 2>&1 &
          ready=false
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:7050/health/ready > /dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "${ready}" != "true" ]]; then
            echo "::error::Agent did not become ready"
            exit 1
          fi
      - name: Select visible split and immutable run ID
        id: eval-ids
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            eval_split="development"
          else
            eval_split="${{ inputs.split }}"
          fi
          run_id="online-${eval_split}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          repeat_run_id="${run_id}-repeat-k5"
          fault_run_id="${run_id}-fault-matrix"
          benchmark_run_id="${run_id}-db-batch"
          echo "EVAL_SPLIT=${eval_split}" >> "${GITHUB_ENV}"
          echo "RUN_ID=${run_id}" >> "${GITHUB_ENV}"
          echo "REPEAT_RUN_ID=${repeat_run_id}" >> "${GITHUB_ENV}"
          echo "FAULT_RUN_ID=${fault_run_id}" >> "${GITHUB_ENV}"
          echo "BENCHMARK_RUN_ID=${benchmark_run_id}" >> "${GITHUB_ENV}"
          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
          echo "repeat_run_id=${repeat_run_id}" >> "${GITHUB_OUTPUT}"
          echo "fault_run_id=${fault_run_id}" >> "${GITHUB_OUTPUT}"
          echo "benchmark_run_id=${benchmark_run_id}" >> "${GITHUB_OUTPUT}"
      - name: Verify providers and full-stack dependencies
        run: python -m evaluation.cli preflight --split "${EVAL_SPLIT}"
      - name: Execute all Search, RAG, and Agent hard gates
        run: >-
          python -m evaluation.cli run
          --split "${EVAL_SPLIT}"
          --run-id "${RUN_ID}"
      - name: Emit independent visible slice report
        run: |
          mkdir -p .eval-reports
          python -m evaluation.cli slices \
            --split "${EVAL_SPLIT}" \
            --run-id "${RUN_ID}" > .eval-reports/slices.json
      - name: Execute Agent pass^5 reliability evidence
        run: >-
          python -m evaluation.cli repeat
          --split "${EVAL_SPLIT}"
          --k 5
          --run-id "${REPEAT_RUN_ID}"
      - name: Execute request-scoped fault recovery matrix
        if: env.EVAL_SPLIT == 'development'
        run: >-
          python -m evaluation.cli fault-test
          --scenario-file evaluation/fault_scenarios.json
          --split development
          --run-id "${FAULT_RUN_ID}"
      - name: Execute local DB batch versus N+1 benchmark
        if: env.EVAL_SPLIT == 'development'
        run: >-
          python -m evaluation.cli benchmark-db
          --sizes 1,10,50,100
          --iterations 3
          --run-id "${BENCHMARK_RUN_ID}"
      - name: Upload immutable run evidence and service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-ai-evaluation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            AI_Shop-backend/AI_Shop-agent/evaluation/.runs/${{ steps.eval-ids.outputs.run_id }}
            AI_Shop-backend/AI_Shop-agent/evaluation/.runs/${{ steps.eval-ids.outputs.repeat_run_id }}
            AI_Shop-backend/AI_Shop-agent/evaluation/.runs/${{ steps.eval-ids.outputs.fault_run_id }}
            AI_Shop-backend/AI_Shop-agent/evaluation-evidence/benchmarks/db/${{ steps.eval-ids.outputs.benchmark_run_id }}
            AI_Shop-backend/AI_Shop-agent/.eval-reports
            AI_Shop-backend/AI_Shop-agent/.eval-logs
          if-no-files-found: warn
